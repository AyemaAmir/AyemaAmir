<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    height: 100vh;
    font-family: "Segoe UI", Arial, sans-serif;
  }

  .container {
    display: flex;
    align-items: center;
    gap: 30px;
  }

  .text-box {
    font-size: 20px;
    line-height: 1.6;
    color: #333333;
    border-right: 2px solid #00bcd4;
    white-space: nowrap;
    overflow: hidden;
    width: 0;
    animation: typing 6s steps(60, end) forwards, blink 0.8s infinite;
  }

  @keyframes typing {
    from { width: 0 }
    to { width: 52em } /* Adjust width for full text */
  }

  @keyframes blink {
    0%, 100% { border-color: transparent }
    50% { border-color: #00bcd4 }
  }

  .highlight {
    color: #00bcd4;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="container">
    <!-- Your left GIF -->
    <img src="https://user-images.githubusercontent.com/74038190/212748842-9fcbad5b-6173-4175-8a61-521f3dbb7514.gif" width="160px"/>

    <!-- Typing text -->
    <div class="text-box">
      👋 Hi, I'm <span class="highlight">Ayema Amir</span><br>
      💡 A passionate <span class="highlight">Data Scientist</span><br>
       who loves turning raw data into actionable insights.<br>
      📊 Exploring <span class="highlight">AI,<br>
       Machine Learning & Analytics</span><br>
       to solve real-world problems.
    </div>
  </div>
</body>
</html>
